<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Entry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Quiz_entry_page.css">
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <h2>Loading Quiz...</h2>
    </div>

    <div class="Quiz_begin_page">
        <div class="timerstr Quiz_begin_page_hidder">
            <h1 class="timerstr1">3</h1>
        </div>

        <div class="Quiz_begin_entry">
            <div class="Quiz_begin_main">
                <h2>Read the Instructions and Start</h2>
                <div class="Quiz_begin_main_paragraph">
                    <div class="Quiz_begin_main_img"></div>
                    <p class="info">Loading...</p>
                </div>
                <div class="button_container">
                    <button class="Quiz_begin_back">Back</button>
                    <button class="Quiz_begin_start">Start</button>
                </div>
            </div>
        </div>
    </div>
    <script src="Quiz_entry_page.js"></script>
</body>
</html>
