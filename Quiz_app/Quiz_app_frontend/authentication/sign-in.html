<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up - Quiz Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Login_main">
        <form class="Login" id="signup-form">
            <h1>Sign-Up</h1>
            <label for="UN">Username:</label>
            <input type="text" id="UN" placeholder="Enter your username" required />

            <label for="Email">Email ID:</label>
            <input type="email" id="Email" placeholder="Enter your Email" required />

            <label for="pswd">Password:</label>
            <input type="password" id="pswd" placeholder="Enter your Password" required />

            <label for="pswd2">Re-enter Password:</label>
            <input type="password" id="pswd2" placeholder="Re-enter your Password" required />
            
            <button type="submit" class="Login_Submit" id="submitBtn">
                <span class="btn-text">Submit</span>
                <div id="spinner" class="spinner" style="display: none;"></div>
            </button>
            <p id="form-message"></p>
            <p class="form-link">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script>
        const form = document.getElementById('signup-form');
        const button = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.querySelector('.btn-text');
        const message = document.getElementById('form-message');

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('Email').value.trim();
            const pswd = document.getElementById('pswd').value.trim();
            const pswd2 = document.getElementById('pswd2').value.trim();
            const username = document.getElementById('UN').value.trim();

            message.textContent = ''; 

            if (!email || !pswd || !username || !pswd2) {
                message.textContent = "Please fill in all fields.";
                message.className = 'error';
                return;
            }

            if (pswd !== pswd2) {
                message.textContent = 'Passwords do not match.';
                message.className = 'error';
                return;
            }

            button.disabled = true;
            spinner.style.display = 'block';
            btnText.style.display = 'none';
            let isRegistrationSuccessful = false; 

            fetch('https://quiz-web-ujwh.onrender.com/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: username, email: email, password: pswd })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.message || 'Registration failed') });
                }
                return res.json();
            })
            .then(data => {
                isRegistrationSuccessful = true; 
                
                message.textContent = data.message || 'Registration successful!';
                message.className = 'success';
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    setTimeout(() => {
                        window.location.href = '../TopicSelectionPage/startPage1.html';
                    }, 1500);
                }
            })
            .catch(err => {
                message.textContent = err.message;
                message.className = 'error';
            })
            .finally(() => {
                if (!isRegistrationSuccessful) {
                    button.disabled = false;
                    spinner.style.display = 'none';
                    btnText.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
