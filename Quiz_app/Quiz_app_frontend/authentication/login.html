<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  
  <div class="Login_main">
    <div class="Login">
      <h1>Login</h1>
      <label for="Email">Email ID:</label>
      <input type="text" id="Email" placeholder="Enter your Email" />
      <label for="pswd">Password:</label>
      <input type="text" id="pswd" placeholder="Enter your Password" />
      <button class="Login_Submit" id="submitBtn">Submit</button>
      <div id="spinner" class="spinner" style="display: none;"></div>
    </div>
  </div>

  <script>
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');

    submitBtn.addEventListener('click', () => {
      const emailValue = document.getElementById('Email').value;
      const pswdValue = document.getElementById('pswd').value;

      if (emailValue && pswdValue) {
        spinner.style.display = 'block';
        submitBtn.disabled = true;

        fetch('https://quiz-web-ujwh.onrender.com/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: emailValue,
            password: pswdValue
          })
        })
        .then(res => res.json())
        .then(data => {
          alert(data.message || 'Login successful!');
          if (data.token && data.token !== '') {
            localStorage.setItem('token', data.token);
            window.location.href='../TopicSelectionPage/startPage1.html';
          }
        })
        .catch(err => {
          console.error(err);
          alert('Login failed.');
        })
        .finally(() => {
          spinner.style.display = 'none';
          submitBtn.disabled = false;
        });
      } else {
        alert("Please fill all fields");
      }
    });
  </script>
</body>
</html>
