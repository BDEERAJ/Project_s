<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Quiz Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Login_main">
        <form class="Login">
            <h1>Login</h1>
            <label for="Email">Email ID:</label>
            <input type="email" id="Email" placeholder="Enter your Email" required />
            <label for="pswd">Password:</label>
            <input type="password" id="pswd" placeholder="Enter your Password" required />
            <button type="submit" class="Login_Submit" id="submitBtn">
                <span class="btn-text">Submit</span>
                <div id="spinner" class="spinner" style="display: none;"></div>
            </button>
            <p id="form-message"></p>
            <p class="form-link">No account? <a href="sign-in.html">Sign Up</a></p>
        </form>
    </div>

    <script>
        const loginForm = document.querySelector('.Login');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.querySelector('.btn-text');
        const message = document.getElementById('form-message');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('Email').value;
            const password = document.getElementById('pswd').value;

            if (!email || !password) {
                message.textContent = "Please fill in all fields.";
                message.className = 'error';
                return;
            }

            spinner.style.display = 'block';
            btnText.style.display = 'none';
            submitBtn.disabled = true;
            message.textContent = '';

            fetch('https://quiz-web-ujwh.onrender.com/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.message || 'Login failed') });
                }
                return res.json();
            })
            .then(data => {
                if (data.token) {
                    message.textContent = 'Login successful! Redirecting...';
                    message.className = 'success';
                    localStorage.setItem('token', data.token);
                    setTimeout(() => {
                        window.location.href = '../TopicSelectionPage/startPage1.html';
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Login failed: No token received.');
                }
            })
            .catch(err => {
                message.textContent = err.message;
                message.className = 'error';
            })
            .finally(() => {
                if (!localStorage.getItem('token')) {
                    spinner.style.display = 'none';
                    btnText.style.display = 'block';
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
